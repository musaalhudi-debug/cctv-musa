<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V380 Pro - ID: 87853128</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <!-- Lucide Icons -->
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'DM Sans', sans-serif; }
        body {
            background-color: #0b0f15;
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        /* Container mirip layar HP */
        .phone-frame {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 850px;
            background-color: #f4f6f8;
            color: #1f2937;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        @media (min-width: 421px) {
            .phone-frame { border-radius: 30px; border: 10px solid #1f2937; }
        }
        .video-box {
            position: relative;
            width: 100%;
            height: 250px;
            background-color: #000;
        }
        .toolbar-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            color: #4b5563;
            background: none;
            border: none;
            cursor: pointer;
            gap: 4px;
        }
        .toolbar-btn:hover { color: #2563eb; }
        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            padding: 14px 16px;
            border-bottom: 1px solid #f0f2f5;
            cursor: pointer;
        }
        .menu-item:hover { background: #fafafa; }
    </style>
</head>
<body>

    <div class="phone-frame">
        <!-- Top Bar (Header V380 Pro) -->
        <div style="background-color: #ffffff; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e5e7eb;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <span style="font-size: 18px; font-weight: bold; cursor: pointer;">&lt;</span>
                <span style="font-size: 15px; font-weight: 600;">Pustaka (ID: 87853128)</span>
            </div>
            <button style="background: #e0f2fe; color: #0284c7; border: none; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: bold;">PEMUTARAN</button>
        </div>

        <!-- Area Video Live CCTV (Sesuai Screenshot Anda) -->
        <div class="video-box">
            <!-- Jika Anda memiliki stream lokal (misal RTSP converter), pasang tag <video> atau <img> di sini -->
            <img id="liveFeedImg" src="https://images.pexels.com/photos/430208/pexels-photo-430208.jpeg?auto=compress&cs=tinysrgb&w=800" style="width: 100%; height: 100%; object-fit: cover;" alt="Live CCTV">
            
            <!-- Indikator Resolusi & Waktu di Pojok Video -->
            <div style="position: absolute; top: 10px; left: 10px; color: #fff; font-size: 11px; font-weight: bold; background: rgba(0,0,0,0.4); padding: 2px 6px; border-radius: 4px;">1080P</div>
            <div id="cctvTimestamp" style="position: absolute; top: 10px; right: 10px; color: #fff; font-size: 11px; font-family: monospace; background: rgba(0,0,0,0.4); padding: 2px 6px; border-radius: 4px;">2026-08-23 00:05:09</div>
        </div>

        <!-- Menu Pilihan Tengah (Peristiwa, Pemutaran Awan, Pengaturan) -->
        <div style="flex: 1; background-color: #f4f6f8; overflow-y: auto;">
            <div class="menu-item" onclick="showAlert('Membuka menu Peristiwa & Wawasan AI')">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <span style="color: #3b82f6;"><i data-lucide="bell" style="width: 20px; height: 20px;"></i></span>
                    <span style="font-size: 14px; font-weight: 500;">Peristiwa</span>
                </div>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <span style="background: #dbeafe; color: #1d4ed8; font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: bold;">Wawasan AI</span>
                    <span style="color: #9ca3af;">&gt;</span>
                </div>
            </div>

            <div class="menu-item" onclick="showAlert('Membuka Pemutaran Awan V380 Pro')">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <span style="color: #3b82f6;"><i data-lucide="play-circle" style="width: 20px; height: 20px;"></i></span>
                    <span style="font-size: 14px; font-weight: 500;">Pemutaran Awan</span>
                </div>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <span style="background: #fef3c7; color: #d97706; font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: bold;">Uji Coba Gratis</span>
                    <span style="color: #9ca3af;">&gt;</span>
                </div>
            </div>

            <div class="menu-item" onclick="showAlert('Membuka Pengaturan Kamera ID: 87853128')">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <span style="color: #3b82f6;"><i data-lucide="settings" style="width: 20px; height: 20px;"></i></span>
                    <span style="font-size: 14px; font-weight: 500;">Pengaturan</span>
                </div>
                <span style="color: #9ca3af;">&gt;</span>
            </div>
        </div>

        <!-- Toolbar Bawah (Persis seperti tombol di aplikasi V380 Pro Anda) -->
        <div style="background-color: #ffffff; padding: 12px 10px; display: flex; justify-content: space-around; border-top: 1px solid #e5e7eb;">
            <button class="toolbar-btn" onclick="showAlert('Membuka Kontrol PTZ Arah Kamera')">
                <span style="background: #eff6ff; padding: 8px; border-radius: 50%; color: #2563eb;"><i data-lucide="move" style="width: 18px; height: 18px;"><span></span></i></span>
                PTZ
            </button>
            <button class="toolbar-btn" onclick="showAlert('Foto Snapshot disimpan!')">
                <span style="background: #f3f4f6; padding: 8px; border-radius: 50%; color: #374151;"><i data-lucide="camera" style="width: 18px; height: 18px;"></i></span>
                Foto
            </button>
            <button class="toolbar-btn" onclick="showAlert('Mikrofon Intercom Diaktifkan')">
                <span style="background: #f3f4f6; padding: 8px; border-radius: 50%; color: #374151;"><i data-lucide="mic" style="width: 18px; height: 18px;"></i></span>
                Berbicara
            </button>
            <button class="toolbar-btn" onclick="showAlert('Memulai Perekaman Video Lokal')">
                <span style="background: #f3f4f6; padding: 8px; border-radius: 50%; color: #374151;"><i data-lucide="video" style="width: 18px; height: 18px;"></i></span>
                Rekaman
            </button>
            <button class="toolbar-btn" onclick="showAlert('Menu Tambahan Lainnya')">
                <span style="background: #f3f4f6; padding: 8px; border-radius: 50%; color: #374151;"><i data-lucide="grid" style="width: 18px; height: 18px;"></i></span>
                Lagi
            </button>
        </div>
    </div>

    <script>
        // Fungsi simulasi notifikasi aksi tombol
        function showAlert(pesan) {
            alert(pesan);
        }

        // Auto update waktu live agar jam pada pojok kanan video terus berjalan secara nyata
        function updateLiveClock() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const time = now.toTimeString().split(' ')[0];
            document.getElementById('cctvTimestamp').textContent = `${year}-${month}-${day} ${time}`;
        }

        setInterval(updateLiveClock, 1000);
        lucide.createIcons();
    </script>
</body>
</html>
