<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinyCam Web Viewer - V380 Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <!-- Lucide Icons -->
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; }
        body {
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        /* Bingkai Layar ala TinyCam */
        .tinycam-container {
            width: 100%;
            max-width: 440px;
            height: 100vh;
            max-height: 900px;
            background-color: #1a1a1a;
            color: #d1d5db;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9);
            border: 1px solid #333;
        }
        @media (min-width: 441px) {
            .tinycam-container { border-radius: 20px; }
        }
        /* Area Video Kamera */
        .cam-screen {
            position: relative;
            width: 100%;
            height: 270px;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .cam-badge-top {
            position: absolute;
            top: 10px;
            left: 10px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px;
            color: #fff;
            font-weight: bold;
            background: rgba(0,0,0,0.4);
            padding: 1px 6px;
            border-radius: 3px;
            z-index: 10;
        }
        .cam-badge-time {
            position: absolute;
            top: 10px;
            right: 10px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            color: #fff;
            background: rgba(0,0,0,0.4);
            padding: 1px 6px;
            border-radius: 3px;
            z-index: 10;
        }
        /* Grid Preset ala TinyCam */
        .preset-section {
            padding: 16px;
            background-color: #242424;
            border-top: 1px solid #333;
        }
        .preset-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 14px;
        }
        .preset-btn {
            background-color: #3b3b3b;
            color: #9ca3af;
            border: none;
            border-radius: 4px;
            height: 48px;
            font-size: 18px;
            font-weight: 500;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
        }
        .preset-btn:active { background-color: #2563eb; color: #fff; }
        .preset-btn.dots { font-size: 20px; letter-spacing: 2px; }
        
        /* Baris Video & IP-Camera Status */
        .settings-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #2e2e2e;
            padding: 12px 16px;
            border-radius: 4px;
        }
        .footer-status {
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #1a1a1a;
            border-top: 1px solid #2c2c2c;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <div class="tinycam-container">
        <!-- Area Tampilan Video Utama (Sesuai Screenshot TinyCam) -->
        <div class="cam-screen">
            <div class="cam-badge-top">1080P</div>
            <div id="cctvTimestamp" class="cam-badge-time">2026-08-23 00:00:00</div>

            <!-- Elemen Video/Stream (Akan mencoba menarik dari IP 192.168.0.186 jika dijalankan lokal) -->
            <img id="streamImage" style="width: 100%; height: 100%; object-fit: cover;" alt="CCTV Stream">

            <!-- Pesan Informasi Bypass CORS/HTTPS -->
            <div id="infoOverlay" style="position: absolute; inset: 0; background: rgba(18,18,18,0.92); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center;">
                <i data-lucide="lock" style="width: 28px; height: 28px; color: #f59e0b; margin-bottom: 6px;"></i>
                <p style="font-size: 11px; color: #fcd34d; font-weight: bold; margin-bottom: 4px;">Koneksi HTTPS ke HTTP Lokal Terblokir</p>
                <p style="font-size: 10px; color: #9ca3af; line-height: 1.4;">Agar tampil seperti TinyCam, buka file HTML ini langsung di penyimpanan perangkat Anda (bukan via link internet GitHub).</p>
            </div>
        </div>

        <!-- Tombol Preset 1 - 7 (Sesuai Screenshot Anda) -->
        <div class="preset-section">
            <div style="font-size: 12px; color: #9ca3af; margin-bottom: 8px; font-weight: 500;">Preset</div>
            <div class="preset-grid">
                <button class="preset-btn" onclick="triggerPreset(1)">1</button>
                <button class="preset-btn" onclick="triggerPreset(2)">2</button>
                <button class="preset-btn" onclick="triggerPreset(3)">3</button>
                <button class="preset-btn" onclick="triggerPreset(4)">4</button>
                <button class="preset-btn" onclick="triggerPreset(5)">5</button>
                <button class="preset-btn" onclick="triggerPreset(6)">6</button>
                <button class="preset-btn" onclick="triggerPreset(7)">7</button>
                <button class="preset-btn dots" onclick="triggerPreset('more')">...</button>
            </div>

            <!-- Panel Tombol Video Settings -->
            <div class="settings-bar">
                <span style="font-size: 14px; font-weight: 500; color: #e5e7eb;">Video</span>
                <button onclick="toggleSettings()" style="background: none; border: none; color: #fff; cursor: pointer; display: flex; align-items: center;">
                    <i data-lucide="sliders" style="width: 20px; height: 20px;"></i>
                </button>
            </div>
        </div>

        <!-- Footer Bar dengan Label IP-Camera -->
        <div class="footer-status">
            <div style="display: flex; align-items: center; gap: 8px;">
                <i data-lucide="lock" style="width: 14px; height: 14px; color: #9ca3af;"></i>
                <span style="font-size: 13px; font-weight: 500; color: #e5e7eb;">IP-Camera</span>
            </div>
            <span style="font-size: 11px; color: #6b7280; font-family: monospace;">192.168.0.186:8899</span>
        </div>
    </div>

    <script>
        const targetIp = "192.168.0.186";

        function triggerPreset(num) {
            alert("Mengarahkan PTZ Kamera ke Preset Posisi: " + num);
        }

        function toggleSettings() {
            alert("Pengaturan Video & Port ONVIF (8899) Aktif");
        }

        // Fungsi mencoba memuat stream lokal
        function loadTinyCamStream() {
            const img = document.getElementById("streamImage");
            const overlay = document.getElementById("infoOverlay");

            // Menguji koneksi stream lokal port 81 / snapshot
            img.src = `http://${targetIp}:81/stream?t=` + new Date().getTime();

            img.onload = function() {
                overlay.style.display = "none"; // Sembunyikan pesan jika berhasil tembus ke IP lokal
            };
        }

        // Jam real-time ala TinyCam
        function updateTinyClock() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const time = now.toTimeString().split(' ')[0];
            document.getElementById('cctvTimestamp').textContent = `${year}-${month}-${day} ${time}`;
        }

        setInterval(updateTinyClock, 1000);
        document.addEventListener("DOMContentLoaded", () => {
            loadTinyCamStream();
            lucide.createIcons();
        });
    </script>
</body>
</html>
