<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V380 Pro - Diagnostic View (ID: 87853128)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <!-- Lucide Icons -->
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'DM Sans', sans-serif; }
        body {
            background-color: #0b0f15;
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .phone-frame {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 850px;
            background-color: #f4f6f8;
            color: #1f2937;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        @media (min-width: 421px) {
            .phone-frame { border-radius: 30px; border: 10px solid #1f2937; }
        }
        .video-box {
            position: relative;
            width: 100%;
            height: 250px;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .toolbar-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            color: #4b5563;
            background: none;
            border: none;
            cursor: pointer;
            gap: 4px;
        }
        .toolbar-btn:hover { color: #2563eb; }
        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            padding: 14px 16px;
            border-bottom: 1px solid #f0f2f5;
            cursor: pointer;
        }
        .menu-item:hover { background: #fafafa; }
    </style>
</head>
<body onload="diagnoseConnection()">

    <div class="phone-frame">
        <!-- Top Bar V380 Pro -->
        <div style="background-color: #ffffff; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e5e7eb;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <span style="font-size: 18px; font-weight: bold; cursor: pointer;">&lt;</span>
                <span style="font-size: 15px; font-weight: 600;">Live (ID: 87853128)</span>
            </div>
            <button id="statusBadge" style="background: #fee2e2; color: #dc2626; border: none; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: bold;">TERBLOKIR BROWSER</button>
        </div>

        <!-- Area Kotak Video & Pesan Diagnostik -->
        <div class="video-box">
            <div style="position: absolute; inset: 0; background: #070d14; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center;">
                <i data-lucide="shield-alert" style="width: 36px; height: 36px; color: #f87171; margin-bottom: 8px;"></i>
                <p style="font-size: 12px; font-weight: bold; color: #fca5a5; margin-bottom: 4px;">Koneksi Langsung Dibatasi Browser</p>
                <p style="font-size: 10px; color: #9ca3af; line-height: 1.4;">IP 192.168.0.186 (Port 8899/81) dilindungi kebijakan CORS & tanpa decoder RTSP.</p>
            </div>

            <!-- Indikator Layar Atas Video -->
            <div style="position: absolute; top: 10px; left: 10px; color: #fff; font-size: 11px; font-weight: bold; background: rgba(0,0,0,0.6); padding: 2px 6px; border-radius: 4px;">1080P HD</div>
            <div id="cctvTimestamp" style="position: absolute; top: 10px; right: 10px; color: #fff; font-size: 11px; font-family: monospace; background: rgba(0,0,0,0.6); padding: 2px 6px; border-radius: 4px;">--:--:--</div>
        </div>

        <!-- Menu Pilihan Solusi -->
        <div style="flex: 1; background-color: #f4f6f8; overflow-y: auto;">
            <div class="menu-item" onclick="alert('Gunakan aplikasi V380 Pro resmi di HP untuk melihat stream asli secara penuh, atau gunakan software gateway lokal seperti go2rtc di PC.')">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <span style="color: #3b82f6;"><i data-lucide="help-circle" style="width: 20px; height: 20px;"></i></span>
                    <div>
                        <span style="font-size: 14px; font-weight: 500; display: block;">Solusi Tampil di Web</span>
                        <span style="font-size: 11px; color: #6b7280;">Klik untuk info cara bypass CORS</span>
                    </div>
                </div>
                <span style="color: #9ca3af;">&gt;</span>
            </div>

            <div class="menu-item" onclick="diagnoseConnection()">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <span style="color: #16a34a;"><i data-lucide="refresh-cw" style="width: 20px; height: 20px;"></i></span>
                    <span style="font-size: 14px; font-weight: 500;">Cek Ulang Jaringan Lokal</span>
                </div>
                <span style="color: #9ca3af;">&gt;</span>
            </div>
        </div>

        <!-- Toolbar Bawah V380 Pro -->
        <div style="background-color: #ffffff; padding: 12px 10px; display: flex; justify-content: space-around; border-top: 1px solid #e5e7eb;">
            <button class="toolbar-btn" onclick="alert('Kontrol PTZ Aktif')">
                <span style="background: #eff6ff; padding: 8px; border-radius: 50%; color: #2563eb;"><i data-lucide="move" style="width: 18px; height: 18px;"></i></span>
                PTZ
            </button>
            <button class="toolbar-btn" onclick="alert('Snapshot berhasil disimpan!')">
                <span style="background: #f3f4f6; padding: 8px; border-radius: 50%; color: #374151;"><i data-lucide="camera" style="width: 18px; height: 18px;"></i></span>
                Foto
            </button>
            <button class="toolbar-btn" onclick="alert('Intercom Berbicara Aktif')">
                <span style="background: #f3f4f6; padding: 8px; border-radius: 50%; color: #374151;"><i data-lucide="mic" style="width: 18px; height: 18px;"></i></span>
                Berbicara
            </button>
            <button class="toolbar-btn" onclick="alert('Merekam video lokal')">
                <span style="background: #f3f4f6; padding: 8px; border-radius: 50%; color: #374151;"><i data-lucide="video" style="width: 18px; height: 18px;"></i></span>
                Rekaman
            </button>
        </div>
    </div>

    <script>
        function diagnoseConnection() {
            const badge = document.getElementById("statusBadge");
            badge.style.background = "#fef3c7";
            badge.style.color = "#d97706";
            badge.textContent = "MEMERIKSA PORT...";

            setTimeout(() => {
                badge.style.background = "#fee2e2";
                badge.style.color = "#dc2626";
                badge.textContent = "TERBLOKIR BROWSER";
            }, 1500);
        }

        // Jam real-time pada video
        function updateLiveClock() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const time = now.toTimeString().split(' ')[0];
            document.getElementById('cctvTimestamp').textContent = `${year}-${month}-${day} ${time}`;
        }

        setInterval(updateLiveClock, 1000);
        lucide.createIcons();
    </script>
</body>
</html>
